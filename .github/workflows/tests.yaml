name: Tests (Dev Container)

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dev Containers CLI
        run: npm install -g @devcontainers/cli

      - name: Build Dev Container
        run: devcontainer build \
          --workspace-folder .

      - name: Run tests inside Dev Container
        run: |
          devcontainer exec \
            --workspace-folder . \
            npm test
